user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_id=$request_id_value '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 客户端未传 X-Request-ID 时由 Nginx 生成，保证跨层日志可关联。
    map $http_x_request_id $request_id_value {
        default $http_x_request_id;
        ""      $request_id;
    }

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    upstream c5_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 探针请求不写访问日志，避免刷屏
        location = /health {
            proxy_pass http://c5_api/health;
            access_log off;
        }

        location ^~ /api/ {
            proxy_pass http://c5_api;
        }

        location ^~ /buildings {
            proxy_pass http://c5_api;
        }

        location ^~ /classrooms {
            proxy_pass http://c5_api;
        }

        location ^~ /swagger/ {
            proxy_pass http://c5_api;
        }

        location = /swagger {
            return 301 /swagger/index.html;
        }

        location / {
            return 404;
        }
    }
}
