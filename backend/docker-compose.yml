name: c5-indoor-navigation

services:
  mysql:
    image: mysql:8.0
    container_name: c5-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-c5_navigation}
      MYSQL_USER: ${MYSQL_USER:-c5}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-c5pass}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - c5net

  redis:
    image: redis:7-alpine
    container_name: c5-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - c5net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c5-api
    environment:
      APP_ENV: prod
      APP_PORT: "8080"
      APP_VERSION: ${APP_VERSION:-dev}
      BUILDING_CODE: C5
      MYSQL_DSN: ${MYSQL_USER:-c5}:${MYSQL_PASSWORD:-c5pass}@tcp(mysql:3306)/${MYSQL_DATABASE:-c5_navigation}?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS:-900}
      ROUTE_CACHE_JITTER_SECONDS: ${ROUTE_CACHE_JITTER_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - c5net

  nginx:
    image: nginx:1.27-alpine
    container_name: c5-nginx
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - c5net

volumes:
  mysql_data:
  redis_data:

networks:
  c5net:
    driver: bridge
